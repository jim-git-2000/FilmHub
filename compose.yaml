name: filmhub
services:
  api:
    image: ${FILMHUB_IMAGE:-filmhub}-api:${FILMHUB_TAG:-local}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    volumes:
      - data:/data
      - uploads:/uploads
      - backups:/backups
    environment:
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
      BACKUPS_DIR: /backups
    security_opt:
      - no-new-privileges:true
  web:
    image: ${FILMHUB_IMAGE:-filmhub}-web:${FILMHUB_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FILMHUB_PORT:-3080}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  data:
  uploads:
  backups:
