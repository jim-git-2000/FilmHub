name: FilmHub CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: '人工验收后，将本次镜像发布到 GHCR（不会部署）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: filmhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Python dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Run service and HTTP integration tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Record resolved dependency versions
        run: python -m pip freeze > backend/requirements-ci.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dependencies
          path: backend/requirements-ci.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore dependencies
        run: |
          python -m pip install -r backend/requirements-test.txt
          npm install --prefix frontend --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Production build
        run: npm run build --prefix frontend
      - name: Install CI browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:e2e --prefix frontend
      - name: Save browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dependencies
          path: frontend/package-lock.json
  package:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dependencies
          path: frontend
      - uses: actions/download-artifact@v4
        with:
          name: backend-dependencies
          path: backend
      - uses: docker/setup-buildx-action@v3
      - name: Validate and build deployment
        run: |
          docker compose config --quiet
          docker compose build
          docker compose pull gateway
          docker compose up -d --wait --wait-timeout 180
      - name: Container smoke test
        run: python3 scripts/container_smoke.py
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > container-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-logs
          path: container-logs.txt
      - name: Export downloadable deployment
        run: |
          mkdir -p dist/docker
          docker save filmhub-api:local filmhub-web:local nginx:1.28-alpine | gzip > dist/filmhub-images.tar.gz
          cp compose.yaml README.md .env.example dist/
          cp docker/nginx.conf dist/docker/
          cp frontend/package-lock.json backend/requirements-ci.txt dist/
          cp docs/IMPLEMENTATION.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: filmhub-linux-amd64
          path: dist/
          retention-days: 14
      - name: Stop CI containers
        if: always()
        run: docker compose down
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filmhub-linux-amd64
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reviewed images to GHCR
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          docker load -i dist/filmhub-images.tar.gz
          image_base="ghcr.io/${REPOSITORY,,}"
          for service in api web; do
            docker tag "filmhub-${service}:local" "${image_base}-${service}:${REVISION}"
            docker push "${image_base}-${service}:${REVISION}"
          done
